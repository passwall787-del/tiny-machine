name: Tiny Machine P1 Android

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "main.gd"
      - "main.tscn"
      - "piece.gd"
      - "export_presets.cfg"
      - ".github/workflows/android-p0.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Tiny Machine P1 Android ARM64 APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Godot CI Docker image
        run: |
          docker pull barichello/godot-ci:4.7.2
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            barichello/godot-ci:4.7.2 \
            bash -lc '
              set -e
              mkdir -p /root/.config/godot
              godot --headless --editor --import --quit
              mkdir -p build/android
              godot --headless --verbose --export-debug "Android" build/android/TinyMachineP1.apk
              test -s build/android/TinyMachineP1.apk
              sha256sum build/android/TinyMachineP1.apk
              ls -lh build/android/TinyMachineP1.apk
            '

      - name: Upload to temporary Litterbox
        id: litterbox
        continue-on-error: true
        run: |
          URL=$(curl -f -sS --retry 3 --retry-delay 2 \
            -F "reqtype=fileupload" \
            -F "time=1h" \
            -F "fileToUpload=@build/android/TinyMachineP1.apk;type=application/vnd.android.package-archive" \
            https://litterbox.catbox.moe/resources/internals/api.php)
          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Temporary download URL: $URL"

      - name: Publish public GitHub release fallback
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tiny-machine-p1-${{ github.run_number }}
          name: Tiny Machine P1 ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          body: |
            Tiny Machine P1 Android ARM64 debug build.
            Target entry is terminal: the simulation stops immediately on success.
            A temporary Litterbox URL may also appear in the workflow log.
          files: build/android/TinyMachineP1.apk
